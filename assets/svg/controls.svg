        <symbol id="btn-throw" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="30" fill="rgba(255,255,255,0.12)" filter="url(#soft-blur)" />
            <circle cx="32" cy="32" r="29" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
            <g fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M14 46 C20 40, 28 38, 38 36" />
                <path d="M10 52 C18 44, 26 42, 34 40" />
            </g>
            <g transform="translate(20,12) rotate(-25 16 20)">
                <path d="M16 6 
             C14 6, 13 8, 13 10
             L14 32
             C14 35, 18 37, 22 37
             C26 37, 30 35, 30 32
             L31 10

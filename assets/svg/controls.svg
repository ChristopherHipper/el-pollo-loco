    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
        <defs>
            <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
            </filter>
        </defs>

        <symbol id="btn-left" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="30" fill="rgba(255,255,255,0.12)" filter="url(#soft-blur)" />
            <circle cx="32" cy="32" r="29" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
            <path d="M38 20 L24 32 L38 44" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round" />
        </symbol>

        <symbol id="btn-right" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="30" fill="rgba(255,255,255,0.12)" filter="url(#soft-blur)" />
            <circle cx="32" cy="32" r="29" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
            <path d="M26 20 L40 32 L26 44" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round" />
